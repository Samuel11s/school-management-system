name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"
  PHP_EXTENSIONS: bcmath, intl, pdo_pgsql, pdo_sqlite, redis, zip, gd, exif

jobs:
  quality:
    name: Code quality (syntax, Pint, Larastan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n 50 -P 4 php -l > /dev/null

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Prepare environment for static analysis
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Static analysis (Larastan)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Dependency audit
        run: composer audit --no-interaction --abandoned=report

  tests-sqlite:
    name: Tests (SQLite, with coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Unit tests
        run: php artisan test --testsuite=Unit

      - name: Feature tests with coverage
        run: php artisan test --coverage-clover=coverage.xml --min=80 --log-junit=junit.xml

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sqlite
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore
          retention-days: 14

  tests-pgsql:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: school_testing
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: school_testing
      DB_USERNAME: school
      DB_PASSWORD: school
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations and demo seeders
        run: php artisan migrate:fresh --seed --force
        env:
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Roll back and re-apply migrations
        run: php artisan migrate:refresh --force
        env:
          CACHE_STORE: array

      - name: Test suite
        run: php artisan test --log-junit=junit-pgsql.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pgsql
          path: junit-pgsql.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Front-end (lint and build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          push: false
          tags: school-management-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build web (Nginx) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: web
          push: false
          tags: school-management-web:ci
          cache-from: type=gha,scope=app
