[www]
; Expose the status/ping endpoints (only reachable inside the container network)
ping.path = /ping
pm.status_path = /status
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Pass environment variables through to PHP
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
